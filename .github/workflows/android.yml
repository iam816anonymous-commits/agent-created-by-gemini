name: Android APK Build & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          echo "Using preinstalled Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper jar..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x ./gradlew

      - name: Run Unit Tests
        run: |
          echo "::group::Executing LocalAgent Unit Tests"
          ./gradlew testDebugUnitTest --continue --stacktrace
          echo "::endgroup::"

      - name: Build Debug APK
        run: |
          echo "::group::Assembling Debug APK"
          ./gradlew assembleDebug --stacktrace
          echo "::endgroup::"

      - name: Verify Debug APK Output Exists
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error file=$DEBUG_APK::Expected Debug APK was not generated!"
            exit 1
          fi
          echo "DEBUG_APK_PATH=$DEBUG_APK" >> $GITHUB_ENV
          echo "Debug APK successfully verified at $DEBUG_APK"

      - name: Attempt Release APK Build
        id: build_release
        continue-on-error: true
        run: |
          echo "::group::Assembling Release APK"
          ./gradlew assembleRelease --stacktrace
          RELEASE_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "RELEASE_APK_PATH=$RELEASE_APK" >> $GITHUB_ENV
            echo "Release APK generated at $RELEASE_APK"
          else
            echo "No release APK produced (release signing key may not be configured in CI)."
          fi
          echo "::endgroup::"

      - name: Generate Build & Size Audit Report
        run: |
          echo "### 📱 LocalAgent Android APK Build & Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Path | Size (MiB) | Size (Bytes) | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          for apk in $(find app/build/outputs/apk/ -name "*.apk"); do
            BYTES=$(stat -c%s "$apk")
            MIB=$(awk "BEGIN {printf \"%.2f\", $BYTES/1048576}")
            SHA=$(sha256sum "$apk" | awk '{print $1}')
            NAME=$(basename "$apk")
            echo "| **$NAME** | \`$apk\` | **$MIB MiB** | $BYTES | \`$SHA\` |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🎯 Target Specifications" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Device**: TECNO Camon i Click (IN6 / MediaTek Helio P23)" >> $GITHUB_STEP_SUMMARY
          echo "- **Packaged ABIs**: \`arm64-v8a\`, \`armeabi-v7a\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Min SDK**: 24 (Android 7.0 - fully supports Android 8.1 / API 27)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK**: 35 (Android 15)" >> $GITHUB_STEP_SUMMARY
          echo "- **R8 Shrinking**: Enabled for Release build" >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: localagent-debug-apk
          path: ${{ env.DEBUG_APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact (if available)
        if: env.RELEASE_APK_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: localagent-release-apk
          path: ${{ env.RELEASE_APK_PATH }}
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localagent-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
